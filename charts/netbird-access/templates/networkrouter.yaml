{{- /* Skipped when router.name is empty (e.g. a consumer-only release that only injects sidecars). */}}
{{- if .Values.router.name }}
apiVersion: netbird.io/v1alpha1
kind: NetworkRouter
metadata:
  name: {{ .Values.router.name }}
  namespace: {{ .Release.Namespace }}
spec:
  dnsZoneRef:
    name: {{ .Values.dnsZone }}
  logLevel: {{ .Values.router.logLevel }}
  {{- with .Values.router.workloadOverride }}
  workloadOverride:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
